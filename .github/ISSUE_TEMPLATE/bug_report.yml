name: Bug report
description: Report incorrect or unsafe LifePower Control behaviour
title: "[Bug]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: Describe what happened and whether hardware, jobs, wake state, or power state changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the application version, OS/architecture, board/register-set version, and minimal steps. Confirm the current supported release where possible.
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      options:
        - No hardware or power impact observed
        - Hardware state changed but recovery is known
        - Power, boot, wake, or hardware outcome is uncertain
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and recovery
      description: Add a short redacted log or Activity excerpt and the recovery steps already taken. Do not include credentials, setup/session/CSRF tokens, private keys, job output or file contents, private hostnames/addresses, or complete configuration.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security check
      options:
        - label: I removed credentials, tokens, private infrastructure details, identifying hardware data, and unrelated job output.
          required: true
        - label: This is not a suspected vulnerability; security reports use the repository's private vulnerability-reporting form.
          required: true
