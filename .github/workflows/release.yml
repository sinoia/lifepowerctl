name: Tagged release candidate

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and attest exact assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up supported Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: go.sum
      - name: Validate tag and source identity
        run: |
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          test "$(git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}")" = "$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build exact ARM64 release assets
        env:
          REQUIRE_RELEASE_TAG: '1'
        run: make release VERSION="$RELEASE_VERSION"
      - name: Install pinned Syft
        env:
          SYFT_VERSION: '1.54.1'
          SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/syft" syft
          "$RUNNER_TEMP/syft/syft" version
      - name: Generate SPDX SBOM and final checksums
        run: |
          asset_dir="dist/$RELEASE_VERSION"
          archive="lifepowerctl_${RELEASE_VERSION#v}_linux_arm64.tar.gz"
          mkdir "$RUNNER_TEMP/sbom-root"
          tar -xzf "$asset_dir/$archive" -C "$RUNNER_TEMP/sbom-root"
          "$RUNNER_TEMP/syft/syft" scan "dir:$RUNNER_TEMP/sbom-root/lifepowerctl" \
            --output "spdx-json=$asset_dir/SBOM.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' \
            "$asset_dir/SBOM.spdx.json" >/dev/null
          (cd "$asset_dir" && sha256sum \
            "$archive" install.sh uninstall.sh SBOM.spdx.json >checksums.txt)
      - name: Verify exact asset set and checksums
        run: |
          asset_dir="dist/$RELEASE_VERSION"
          archive="lifepowerctl_${RELEASE_VERSION#v}_linux_arm64.tar.gz"
          printf '%s\n' SBOM.spdx.json checksums.txt install.sh \
            "$archive" uninstall.sh >"$RUNNER_TEMP/expected-assets"
          find "$asset_dir" -maxdepth 1 -type f -printf '%f\n' | sort \
            >"$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          (cd "$asset_dir" && sha256sum --check --strict checksums.txt)
          sh -n "$asset_dir/install.sh"
          sh -n "$asset_dir/uninstall.sh"
      - name: Attest release payload provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.RELEASE_VERSION }}/*
      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.RELEASE_VERSION }}/lifepowerctl_*_linux_arm64.tar.gz
          sbom-path: dist/${{ env.RELEASE_VERSION }}/SBOM.spdx.json
      - name: Stage release notes
        run: |
          base_version=${RELEASE_VERSION%%-*}
          test -f ".github/release-notes/$base_version.md"
          cp ".github/release-notes/$base_version.md" \
            "dist/$RELEASE_VERSION/release-notes.md"
      - name: Transfer immutable candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_VERSION }}
          path: dist/${{ env.RELEASE_VERSION }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create protected draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_VERSION }}
          path: candidate
      - name: Revalidate candidate and require an unused release tag
        run: |
          archive="lifepowerctl_${RELEASE_VERSION#v}_linux_arm64.tar.gz"
          printf '%s\n' SBOM.spdx.json checksums.txt install.sh \
            "$archive" release-notes.md uninstall.sh >"$RUNNER_TEMP/expected-assets"
          find candidate -maxdepth 1 -type f -printf '%f\n' | sort \
            >"$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          (cd candidate && sha256sum --check --strict checksums.txt)
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "release already exists and will not be replaced: $RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Create draft release
        run: |
          prerelease_args=()
          case "$RELEASE_VERSION" in *-*) prerelease_args+=(--prerelease) ;; esac
          gh release create "$RELEASE_VERSION" \
            candidate/lifepowerctl_*.tar.gz \
            candidate/install.sh \
            candidate/uninstall.sh \
            candidate/SBOM.spdx.json \
            candidate/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --latest=false \
            "${prerelease_args[@]}" \
            --title "LifePower Control $RELEASE_VERSION" \
            --notes-file candidate/release-notes.md
